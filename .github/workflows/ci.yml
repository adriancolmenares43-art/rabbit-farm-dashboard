name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_data.py data/raw data/data.json
      - run: python scripts/build_pages.py
      - run: pytest -q
      - name: Site must be committed and up to date
        run: git diff --exit-code site/ data/data.json
